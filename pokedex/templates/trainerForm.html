{% extends 'base.html' %}

{% block title %}
Entrenador
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Entrenador</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-success">
            Guardar
        </button>

        <a href="/" class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
